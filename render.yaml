services:
  - type: web
    name: backend-cedo-rehab
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db-cedo-rehab
          property: connectionString
      - key: PORT
        value: 8080

databases:
  - name: db-cedo-rehab
    databaseName: db_cedo_rehab
    user: postgres
    plan: free
    region: oregon
